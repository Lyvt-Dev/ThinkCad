name: Linux and Gentoo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ gdb qt6-base-dev qt6-multimedia-dev gstreamer1.0-plugins-good qt6-serialport-dev qt6-base-dev-tools qt6-qpa-plugins qt6-wayland zlib1g-dev xvfb xauth weston desktop-file-utils appstream dpkg-dev
      - name: Build and test
        env:
          THINKCAD_REQUIRE_GDB: "1"
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_SHARED_LIBS=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          ./build/library_tests --live
          desktop-file-validate packaging/linux/io.github.LyvtDev.ThinkCad.desktop
      - name: X11 and Wayland smoke
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a env GST_DEBUG=2 QT_QPA_PLATFORM=xcb ./build/thinkcad --smoke-test
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=thinkcad-wayland --idle-time=0 --use-pixman > /tmp/thinkcad-weston.log 2>&1 &
          compositor=$!
          trap 'kill "$compositor" || true' EXIT
          for i in $(seq 1 50); do test -S "$XDG_RUNTIME_DIR/thinkcad-wayland" && break; sleep 0.1; done
          GST_DEBUG=2 WAYLAND_DISPLAY=thinkcad-wayland QT_QPA_PLATFORM=wayland ./build/thinkcad --smoke-test
      - name: Package and test installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/linux
          (cd build && cpack -G 'TGZ;DEB' -B ../out/linux)
          sudo apt-get install -y ./out/linux/*.deb
          (cd /tmp && QT_QPA_PLATFORM=offscreen /usr/bin/thinkcad --smoke-test)
          sudo apt-get remove -y thinkcad
          test ! -f /usr/bin/thinkcad
          version=$(sed -n 's/project(ThinkCad VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          python3 packaging/linux/make-source-overlay.py "$version" out/linux
          (cd out/linux && for file in *.deb *.tar.gz *.tar.xz; do sha256sum "$file" > "$file.sha256"; done)
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        id: provenance
        with:
          subject-path: out/linux/ThinkCad-*
      - name: Keep verification bundle
        if: github.event_name != 'pull_request'
        run: cp '${{ steps.provenance.outputs.bundle-path }}' out/linux/ubuntu.sigstore.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ThinkCad-Linux-Ubuntu
          path: |
            out/linux/ThinkCad-*
            out/linux/*.sigstore.jsonl
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:44
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install native dependencies
        run: dnf -y install git cmake ninja-build gcc-c++ gdb qt6-qtbase-devel qt6-qtmultimedia-devel qt6-qtserialport-devel qt6-qtwayland zlib-devel rpm-build xorg-x11-server-Xvfb xorg-x11-xauth xz tar findutils
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          THINKCAD_REQUIRE_GDB: "1"
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          xvfb-run -a env GST_DEBUG=2 QT_QPA_PLATFORM=xcb ./build/thinkcad --smoke-test
      - name: Build and install RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/linux
          version=$(sed -n 's/project(ThinkCad VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          (cd build && cpack -G RPM -B ../out/linux -D "CPACK_PACKAGE_FILE_NAME=ThinkCad-$version-Fedora44-x86_64")
          dnf -y install out/linux/*.rpm
          (cd /tmp && QT_QPA_PLATFORM=offscreen /usr/bin/thinkcad --smoke-test)
          dnf -y remove thinkcad
          test ! -f /usr/bin/thinkcad
          (cd out/linux && for file in *.rpm; do sha256sum "$file" > "$file.sha256"; done)
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        id: provenance
        with:
          subject-path: out/linux/ThinkCad-*
      - name: Keep verification bundle
        if: github.event_name != 'pull_request'
        run: cp '${{ steps.provenance.outputs.bundle-path }}' out/linux/fedora.sigstore.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: ThinkCad-Linux-Fedora
          path: |
            out/linux/ThinkCad-*
            out/linux/*.sigstore.jsonl
  gentoo:
    needs: ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ThinkCad-Linux-Ubuntu
          path: out/linux
      - name: Compile through Portage with USE flags
        run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/out/linux:/release:ro" gentoo/stage3:latest bash /src/packaging/gentoo/ci-test.sh

  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Build portable AppImage with bundled sketch compiler
        run: |
          docker build -t thinkcad-appimage packaging/appimage
          docker run --rm -v "$PWD:/src" thinkcad-appimage
      - name: Test portable image on clean Gentoo without system Qt or compiler
        run: |
          docker run --rm -v "$PWD/out/appimage:/images:ro" -e QT_QPA_PLATFORM=offscreen -e APPIMAGE_EXTRACT_AND_RUN=1 -e THINKCAD_SMOKE_TIMEOUT_MS=300000 gentoo/stage3:latest bash -c 'exec /images/ThinkCad-*-x86_64.AppImage --smoke-test'
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        id: appimage_provenance
        with:
          subject-path: out/appimage/ThinkCad-*.AppImage
      - name: Keep AppImage verification bundle
        if: github.event_name != 'pull_request'
        run: |
          image=$(find out/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          sudo cp '${{ steps.appimage_provenance.outputs.bundle-path }}' "$image.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: ThinkCad-AppImage
          path: out/appimage/ThinkCad-*
