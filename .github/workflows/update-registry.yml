name: Windows updater registry regression
on:
  push:
    paths:
      - 'packaging/windows/registry_copy.hpp'
      - 'packaging/windows/update_helper.cpp'
      - 'tests/update_registry_tests.cpp'
      - '.github/workflows/update-registry.yml'
  pull_request:
    paths:
      - 'packaging/windows/registry_copy.hpp'
      - 'packaging/windows/update_helper.cpp'
      - 'tests/update_registry_tests.cpp'
      - '.github/workflows/update-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Compile helper and exercise data-only registry backup and restore
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /utf-8 tests\update_registry_tests.cpp /Fe:registry-tests.exe /link advapi32.lib
          if errorlevel 1 exit /b 1
          registry-tests.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /EHsc /utf-8 /DUNICODE /D_UNICODE packaging\windows\update_helper.cpp /Fe:ThinkCadUpdater.exe /link /SUBSYSTEM:WINDOWS wintrust.lib crypt32.lib shell32.lib comctl32.lib advapi32.lib gdi32.lib user32.lib
          if errorlevel 1 exit /b 1
