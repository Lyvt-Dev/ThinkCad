name: Publish verified desktop builds
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows build run
        required: true
        type: string
      linux_run_id:
        description: Successful Linux and Gentoo build run
        required: true
        type: string
      allow_failed_gentoo:
        description: Publish successful Windows/Ubuntu/Fedora builds despite a failed Gentoo job
        required: false
        default: false
        type: boolean
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      LINUX_RUN_ID: ${{ inputs.linux_run_id }}
      ALLOW_FAILED_GENTOO: ${{ inputs.allow_failed_gentoo }}
    steps:
      - name: Validate build provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          test "$(jq -r '.conclusion' run.json)" = success
          test "$(jq -r '.name' run.json)" = 'Windows desktop and installer'
          build_sha=$(jq -r '.head_sha' run.json)
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          test "$build_sha" = "$tag_sha"
          [[ "$LINUX_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$LINUX_RUN_ID" > linux-run.json
          if test "$(jq -r '.conclusion' linux-run.json)" != success; then
            test "$ALLOW_FAILED_GENTOO" = true
            gh api "repos/$GH_REPO/actions/runs/$LINUX_RUN_ID/jobs" > linux-jobs.json
            jq -e '([.jobs[] | select(.name == "ubuntu" and .conclusion == "success")] | length) == 1 and ([.jobs[] | select(.name == "fedora" and .conclusion == "success")] | length) == 1' linux-jobs.json
          fi
          test "$(jq -r '.name' linux-run.json)" = 'Linux and Gentoo'
          test "$(jq -r '.head_sha' linux-run.json)" = "$tag_sha"
      - name: Retrieve verified installer and corresponding sources
        run: |
          gh run download "$RUN_ID" --repo "$GH_REPO" --name ThinkCad-Windows --dir installer
          gh run download "$LINUX_RUN_ID" --repo "$GH_REPO" --name ThinkCad-Linux-Ubuntu --dir installer
          gh run download "$LINUX_RUN_ID" --repo "$GH_REPO" --name ThinkCad-Linux-Fedora --dir installer
      - name: Record Gentoo validation status
        shell: bash
        run: |
          if test "$(jq -r '.conclusion' linux-run.json)" != success; then
            printf '\n\nGentoo CI failed; its overlay is included but CI validation is not green. Windows, Ubuntu and Fedora passed. Details: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$LINUX_RUN_ID" >> installer/RELEASE_NOTES.md
          fi
      - name: Verify published payload checksums
        working-directory: installer
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "ThinkCad-Setup-${TAG#v}.exe.sha256"
          sha256sum --check qt-everywhere-src-6.8.3.tar.xz.sha256
          test -s ThinkCad-Toolchain-Sources.tar
          test -s "ThinkCad-Setup-${TAG#v}.exe.sigstore.jsonl"
          build_sha=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)
          gh attestation verify "ThinkCad-Setup-${TAG#v}.exe" --bundle "ThinkCad-Setup-${TAG#v}.exe.sigstore.jsonl" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/windows.yml" --source-ref refs/heads/main --source-digest "$build_sha" --deny-self-hosted-runners
      - name: Verify Linux packages and source provenance
        working-directory: installer
        shell: bash
        run: |
          set -euo pipefail
          for checksum in ThinkCad-*.deb.sha256 ThinkCad-*.rpm.sha256 ThinkCad-*.tar.gz.sha256 ThinkCad-*.tar.xz.sha256; do sha256sum --check "$checksum"; done
          build_sha=$(gh api "repos/$GH_REPO/actions/runs/$LINUX_RUN_ID" --jq .head_sha)
          for file in ThinkCad-*.deb ThinkCad-*.tar.gz ThinkCad-*.tar.xz; do
            gh attestation verify "$file" --bundle ubuntu.sigstore.jsonl --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/linux.yml" --source-ref refs/heads/main --source-digest "$build_sha" --deny-self-hosted-runners
          done
          for file in ThinkCad-*.rpm; do
            gh attestation verify "$file" --bundle fedora.sigstore.jsonl --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/linux.yml" --source-ref refs/heads/main --source-digest "$build_sha" --deny-self-hosted-runners
          done
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find installer -maxdepth 1 -type f -print0)
          if gh release view "$TAG" --repo "$GH_REPO" --json assets > existing-release.json; then
            # A manually created source-only release can receive the verified builds.
            # Never overwrite an existing downloadable payload implicitly.
            test "$(jq '.assets | length' existing-release.json)" -eq 0
            gh release upload "$TAG" "${files[@]}" --repo "$GH_REPO"
            gh release edit "$TAG" --repo "$GH_REPO" --title "ThinkCad ${TAG#v}" --notes-file installer/RELEASE_NOTES.md
          else
            gh release create "$TAG" "${files[@]}" --repo "$GH_REPO" --title "ThinkCad ${TAG#v}" --notes-file installer/RELEASE_NOTES.md --verify-tag
          fi
