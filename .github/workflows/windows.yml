name: Windows desktop and installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: qtmultimedia qtserialport
          cache: true
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          location: D:\ThinkCad-msys2
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gdb
      - name: Prepare native compression dependency
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install zlib:x64-windows-static-md
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ZLIB_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> $env:GITHUB_ENV
      - name: Configure signing identity
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          $fingerprint = ''
          if ($env:SIGNING_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'thinkercad-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $env:SIGNING_PFX_PASSWORD)
            $fingerprint = $cert.GetCertHashString([Security.Cryptography.HashAlgorithmName]::SHA256)
          } else {
            Write-Host 'Building without Authenticode; automatic updates use verified GitHub build attestations.'
          }
          "PUBLISHER_SHA256=$fingerprint" >> $env:GITHUB_ENV
          "$env:MSYS2_LOCATION\ucrt64\bin" >> $env:GITHUB_PATH
      - name: Build and test
        shell: pwsh
        env:
          THINKCAD_REQUIRE_GDB: "1"
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          . .github/scripts/Invoke-Checked.ps1
          Invoke-Checked cmake @('-S', '.', '-B', 'build', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=Release', '-DCMAKE_CXX_COMPILER=cl', '-DCMAKE_C_COMPILER=cl', '-DCMAKE_RC_COMPILER=rc', "-DZLIB_ROOT=$env:ZLIB_ROOT", "-DZLIB_LIBRARY_RELEASE=$env:ZLIB_ROOT/lib/zs.lib", "-DTHINKERCAD_PUBLISHER_SHA256=$env:PUBLISHER_SHA256")
          $headers = @('-std=c++20', '-fsyntax-only', '-Isdk', '-Isdk/vendor/busio', '-Isdk/vendor/sensor', '-Isdk/vendor/bme280', '-Isdk/vendor/mpu6050', '-Isdk/vendor/mfrc522', '-Isdk/vendor/dallas', 'tests/vendor_sdk_headers.cpp')
          Invoke-Checked g++ $headers
          Invoke-Checked g++ ($headers + @('-DTHINKCAD_DEBUG_TRANSPORT=1'))
          Invoke-Checked cmake @('--build', 'build', '--parallel', '2')
          Invoke-Checked "$pwd/build/performance_probe.exe" @()
          & ctest --test-dir build --output-on-failure --stop-on-failure
          $testExitCode = $LASTEXITCODE
          if (Test-Path build/desktop-tests.txt) { Get-Content build/desktop-tests.txt | Write-Host }
          if (Test-Path build/experience-tests.txt) { Get-Content build/experience-tests.txt | Write-Host }
          foreach ($name in @('collaboration-tests.txt', 'debugger-tests.txt', 'feature126-tests.txt', 'updater-tests.txt')) {
            if (Test-Path "build/$name") { Get-Content "build/$name" | Write-Host }
          }
          if ($testExitCode -ne 0) { throw "CTest failed with exit code $testExitCode" }
          Invoke-Checked "$pwd/build/library_tests.exe" @('--live')
          Invoke-Checked cmake @('--install', 'build', '--prefix', "$pwd/out/stage")
          Copy-Item "$env:MSYS2_LOCATION\ucrt64" out/stage/toolchain -Recurse
          if (-not (Test-Path out/stage/toolchain/include/stdlib.h)) { throw 'Bundled toolchain is missing native C headers.' }
          New-Item out/stage/licenses -ItemType Directory -Force | Out-Null
          Copy-Item packaging/windows/THIRD_PARTY.md out/stage/licenses/
          Copy-Item packaging/windows/LGPL-3.txt out/stage/licenses/
          Copy-Item "$env:ZLIB_ROOT/share/zlib/copyright" out/stage/licenses/ZLIB_LICENSE.txt
          $env:QT_QPA_PLATFORM = 'offscreen'
          $smoke = Start-Process -FilePath "$pwd/out/stage/ThinkCad.exe" -ArgumentList '--smoke-test' -RedirectStandardOutput "$pwd/out/stage-smoke.stdout.txt" -RedirectStandardError "$pwd/out/stage-smoke.stderr.txt" -Wait -PassThru
          Get-Content out/stage-smoke.stdout.txt, out/stage-smoke.stderr.txt | Write-Host
          if ($smoke.ExitCode) { throw "Installed desktop smoke failed: $($smoke.ExitCode)" }
      - name: Bundle pinned CPython for local scripts
        shell: pwsh
        run: |
          $version = '3.13.16'
          $archive = "$env:RUNNER_TEMP/python-$version-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$version/python-$version-embed-amd64.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '97dae5274cc54867065e8d5a3226e48c35017ed332a0fdb0e27d5b5821961297') { throw 'CPython checksum mismatch' }
          Expand-Archive $archive out/stage/python
          & "$pwd/out/stage/python/python.exe" -c "import sys, math, json; assert sys.version_info[:3] == (3,13,16); print('Bundled CPython ready:', sys.version)"
          if ($LASTEXITCODE) { throw 'Bundled CPython failed' }
          Copy-Item out/stage/python/LICENSE.txt out/stage/licenses/CPYTHON_LICENSE.txt
      - name: Bundle pinned GitHub attestation verifier
        shell: pwsh
        run: |
          $version = '2.102.0'
          $archive = "gh_${version}_windows_amd64.zip"
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v$version/$archive" -OutFile "$env:RUNNER_TEMP/$archive"
          Invoke-WebRequest "https://github.com/cli/cli/releases/download/v$version/gh_${version}_checksums.txt" -OutFile "$env:RUNNER_TEMP/gh-checksums.txt"
          $line = Get-Content "$env:RUNNER_TEMP/gh-checksums.txt" | Where-Object { $_.Trim().EndsWith($archive) }
          $expected = ($line -split '\s+')[0].ToLower()
          if ((Get-FileHash "$env:RUNNER_TEMP/$archive" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'GitHub CLI checksum mismatch.' }
          Expand-Archive "$env:RUNNER_TEMP/$archive" "$env:RUNNER_TEMP/thinkercad-gh"
          New-Item out/stage/verifier -ItemType Directory -Force | Out-Null
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/thinkercad-gh" -Filter gh.exe -Recurse | Select-Object -First 1).FullName out/stage/verifier/
          Copy-Item (Get-ChildItem "$env:RUNNER_TEMP/thinkercad-gh" -Filter LICENSE -Recurse | Select-Object -First 1).FullName out/stage/verifier/GITHUB_CLI_LICENSE.txt
          & "$pwd/out/stage/verifier/gh.exe" attestation trusted-root | Out-File out/stage/verifier/trusted_root.jsonl -Encoding utf8NoBOM
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ThinkCad VERSION ([0-9.]+)').Matches.Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the CMake project version.' }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DVersion=$version" "/DStagingDir=$pwd\out\stage" packaging/windows/ThinkCad.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test installer and uninstaller
        shell: pwsh
        run: |
          $installer = (Get-ChildItem out/installer/*.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'ThinkCad-Installer-Smoke'
          $runOnce = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\RunOnce'
          New-Item $runOnce -Force | Out-Null
          $oldRecovery = '"C:\ThinkCad old cache\ThinkCadUpdater-old.exe" --recover "C:\ThinkCad old cache\transaction.journal"'
          Set-ItemProperty $runOnce -Name ThinkCadUpdateRecovery -Value $oldRecovery
          New-Item -ItemType Directory -Force $installDir | Out-Null
          [IO.File]::WriteAllText("$installDir/local-project.thinkcad", 'personal project must survive repair')
          $install = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir") -Wait -PassThru
          if (Get-ItemPropertyValue $runOnce -Name ThinkCadUpdateRecovery -ErrorAction SilentlyContinue) { throw 'Manual repair retained the old automatic recovery command.' }
          if ((Get-ItemPropertyValue 'HKCU:\Software\Lyvt-Dev\ThinkCadUpdate' -Name SupersededRecovery) -ne $oldRecovery) { throw 'Manual repair did not archive the old recovery command.' }
          if ((Get-Content "$installDir/local-project.thinkcad" -Raw) -ne 'personal project must survive repair') { throw 'Manual repair changed a local project.' }

          if ($install.ExitCode) { throw "Installer failed: $($install.ExitCode)" }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $app = Start-Process -FilePath "$installDir/ThinkCad.exe" -ArgumentList '--smoke-test' -RedirectStandardOutput "$pwd/out/installer-smoke.stdout.txt" -RedirectStandardError "$pwd/out/installer-smoke.stderr.txt" -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Installed app smoke timed out.' }
          Get-Content out/installer-smoke.stdout.txt, out/installer-smoke.stderr.txt | Write-Host
          if ($app.ExitCode) { throw "Installed app failed: $($app.ExitCode)" }
          $uninstall = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -or (Test-Path "$installDir/ThinkCad.exe")) { throw 'Uninstaller failed.' }
      - name: Sign and checksum installer
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $installer = (Get-ChildItem out/installer/*.exe).FullName
          if ($env:PUBLISHER_SHA256) {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signtool sign /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\thinkercad-signing.pfx" /p "$env:SIGNING_PFX_PASSWORD" $installer
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool verify /pa $installer
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            Remove-Item "$env:RUNNER_TEMP\thinkercad-signing.pfx"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $name = Split-Path $installer -Leaf
          [IO.File]::WriteAllText("$installer.sha256", "$hash  $name`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/attest-build-provenance@v3
        if: github.event_name != 'pull_request'
        id: provenance
        with:
          subject-path: out/installer/ThinkCad-Setup-*.exe
      - name: Verify installer provenance and rejection cases
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          . .github/scripts/Invoke-Checked.ps1
          $installer = (Get-ChildItem out/installer/*.exe).FullName
          Copy-Item '${{ steps.provenance.outputs.bundle-path }}' "$installer.sigstore.jsonl"
          Invoke-Checked "$pwd/build/update_verifier_tests.exe" @("$pwd/out/stage/verifier", $installer, $env:GITHUB_SHA)
      - name: Exercise verified update transaction and retained user files
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./.github/scripts/Test-UpdateTransaction.ps1
      - name: Collect corresponding compiler sources
        if: github.event_name != 'pull_request'
        shell: msys2 {0}
        run: bash packaging/windows/collect-toolchain-sources.sh
      - name: Collect matching Qt sources
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $name = 'qt-everywhere-src-6.8.3.tar.xz'
          $url = "https://download.qt.io/archive/qt/6.8/6.8.3/single/$name"
          Invoke-WebRequest "$url.sha256" -OutFile "out/installer/$name.sha256"
          # Reuse the identical Qt archive from the previous release. The official
          # Qt checksum below remains the authority, including for reused bytes.
          $ProgressPreference = 'SilentlyContinue'
          try {
            Invoke-WebRequest "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v0.5.2/$name" -OutFile "out/installer/$name" -TimeoutSec 1200
          } catch {
            Invoke-WebRequest $url -OutFile "out/installer/$name" -TimeoutSec 1200
          }
          $expected = ((Get-Content "out/installer/$name.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash "out/installer/$name" -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'Qt source SHA-256 mismatch.' }
      - name: Include release notes
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(ThinkCad VERSION ([0-9.]+)').Matches.Groups[1].Value
          Copy-Item "docs/RELEASE_NOTES_$version.md" out/installer/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: ThinkCad-Windows
          retention-days: 1
          path: out/installer/*
